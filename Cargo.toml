[package]
name = "envik"
version = "0.1.1"
edition = "2024"
description = "Builds .env files from templates, overrides and command-line values."
repository = "https://github.com/rhangai/envik"
license = "MIT"

[dependencies]
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
thiserror = "2.0.21"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
