name: Prepare release

# Bumps the version, writes the changelog, commits, tags and pushes with the
# deploy key (see release.toml). That push starts the cargo-dist "Release"
# workflow; a tag pushed with the default GITHUB_TOKEN would not.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0). Empty: worked out from the commits."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check the deploy key
        env:
          DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::The RELEASE_DEPLOY_KEY secret is not set. Create a deploy key with write access (Settings > Deploy keys) and put its private key in Settings > Secrets and variables > Actions > RELEASE_DEPLOY_KEY."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-release,git-cliff

      - name: Release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version="${VERSION:-$(git cliff --bumped-version)}"
          cargo release "${version#v}" --execute --no-confirm
