# git-cliff: changelog and version bumps from Conventional Commits.
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project are documented here.
"""
# The `## [x.y.z] - date` heading is what cargo-dist (parse-changelog) looks
# for to use as the GitHub Release notes.
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = false

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactor" },
  { message = "^docs?", group = "<!-- 4 -->Docs" },
  { message = "^ci", group = "<!-- 5 -->CI" },
  { message = ".*", group = "<!-- 6 -->Others" },
]
tag_pattern = "v[0-9].*"
sort_commits = "oldest"

[bump]
# Before 1.0: `feat` bumps the minor, `fix` the patch, and a breaking change
# the minor too (semver's rule for 0.x).
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
