# cargo-release: run by the "Prepare release" workflow, or locally as
# `cargo release <version>` (a dry run unless given --execute).
publish = false
allow-branch = ["main"]
pre-release-commit-message = "chore(release): v{{version}}"
tag-message = "v{{version}}"
# Skipped on dry runs, which would otherwise leave CHANGELOG.md modified.
pre-release-hook = ["sh", "-c", "[ \"$DRY_RUN\" = true ] || git cliff --tag v{{version}} --output CHANGELOG.md"]
